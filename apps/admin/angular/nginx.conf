server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keycloak OIDC cookies can be large — increase buffer sizes
    large_client_header_buffers 4 32k;

    # SPA routing: all non-file requests serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy pass to WebApi backend
    location /api/ {
        proxy_pass http://webapi:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR proxy (WebSocket support)
    location /notificationshub {
        proxy_pass http://webapi:8080/notificationshub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache static assets aggressively (Angular uses content-hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Do not cache index.html (it references hashed bundles)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Runtime config — not cached (injected at container start)
    location = /assets/runtime-config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Silent SSO page for Keycloak iframe token renewal
    location = /assets/silent-check-sso.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/x-javascript text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
}
