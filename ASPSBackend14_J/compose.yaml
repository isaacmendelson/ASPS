services:
  mysql:
    image: mysql:8.0
    container_name: asps-mysql
    restart: unless-stopped
    command: --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: zappa22
      MYSQL_DATABASE: ASPSBackend2DB
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./aspsbackend2db_20260130.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pzappa22"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - asps-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: asps-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5555:5555"
      - "5556:5556"
      - "50001:50001"
      - "50002:50002"
    environment:
      ConnectionStrings__DefaultConnection: server=mysql;port=3306;database=aspsbackend2db;user=root;password=zappa22;AllowPublicKeyRetrieval=True;SslMode=None;
      Security__KeysFilePath: /app/keys/curve-server-keys.json
    volumes:
      - curve_keys:/app/keys
    networks:
      - asps-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: asps-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --hostname=http://localhost:8081
      - --hostname-backchannel-dynamic=true
      - --hostname-debug=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - asps-network

  webapi:
    build:
      context: .
      dockerfile: Dockerfile.webapi
    container_name: asps-webapi
    restart: unless-stopped
    depends_on:
      - backend
      - keycloak
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8080:8080"
    networks:
      - asps-network

volumes:
  mysql_data:
  curve_keys:
  keycloak_data:

networks:
  asps-network:
    driver: bridge