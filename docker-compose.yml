version: "3.8"

services:
  # ─────────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: asps-mysql
    restart: unless-stopped
    command: --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: zappa22
      MYSQL_DATABASE: ASPSBackend2DB
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Initialize DB with dump on first run
      - ./aspsbackend2db_20260130.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pzappa22"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - asps-network

  # ─────────────────────────────────────────────
  # ASPSBackend (Business layer + Python Analyzer)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: asps-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5555:5555"   # NetMQ CQRS processor
      - "5556:5556"   # CQRS Gateway (WebApi)
      - "50001:50001" # RealTime Alert Listener (Desktop ZMQ REQ)
      - "50002:50002" # Notification Publisher (Desktop ZMQ SUB)
    networks:
      - asps-network

  # ─────────────────────────────────────────────
  # WebApi (Admin Dashboard + REST API)
  # ─────────────────────────────────────────────
  webapi:
    build:
      context: .
      dockerfile: Dockerfile.webapi
    container_name: asps-webapi
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5001:5001"   # Admin Dashboard + Swagger + SignalR
    networks:
      - asps-network

volumes:
  mysql_data:

networks:
  asps-network:
    driver: bridge
