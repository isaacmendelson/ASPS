<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#0D1128;
  color:#fff;
  min-height:100vh;
  display:flex;flex-direction:column;
  overflow-x:clip;
  -webkit-font-smoothing:antialiased;
}

/* ── ATMOSPHERIC BACKGROUND ── */
.bg-grid{
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(31,139,92,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(31,139,92,0.04) 1px, transparent 1px);
  background-size:80px 80px;
  pointer-events:none;
  z-index:0;
  mask-image:radial-gradient(ellipse at 50% 40%, #000 0%, transparent 70%);
}
.bg-glow{
  position:fixed;
  top:30%;left:50%;
  transform:translate(-50%,-50%);
  width:900px;height:900px;
  background:radial-gradient(circle, rgba(31,139,92,0.18) 0%, transparent 60%);
  filter:blur(40px);
  pointer-events:none;
  z-index:0;
}

/* ── FOCUS STYLES ── */
a:focus-visible,button:focus-visible,[role="button"]:focus-visible{
  outline:3px solid #1F8B5C;
  outline-offset:3px;
}

/* ── NAV ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:68px;padding:0 60px;
  display:flex;align-items:center;gap:40px;
  background:rgba(13,17,40,0.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.logo{margin-right:auto;display:block}
nav a{font-size:.84rem;color:#7880A8;text-decoration:none;transition:.2s}
nav a:hover{color:#C8CCE8}
.nav-cta{
  padding:9px 20px;border-radius:8px;
  background:#fff;color:#161E38;
  font-size:.84rem;font-weight:700;
  transition:.2s;cursor:pointer;text-decoration:none;
}
.nav-cta:hover{background:#EEF0FF}

/* ── PAGE ── */
.cs-page{
  flex:1;
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:center;
  padding:140px 24px 100px;
}
.cs-inner{
  max-width:920px;
  width:100%;
  text-align:center;
}

/* Status chip */
.status-chip{
  display:inline-flex;align-items:center;gap:10px;
  padding:8px 16px 8px 14px;
  background:rgba(31,139,92,0.10);
  border:1px solid rgba(31,139,92,0.30);
  border-radius:999px;
  font-family:'Syne',sans-serif;
  font-weight:700;font-size:.72rem;
  letter-spacing:.18em;text-transform:uppercase;
  color:#3FB785;
  margin-bottom:48px;
}
.status-chip-dot{
  position:relative;
  width:8px;height:8px;border-radius:50%;
  background:#3FB785;
  flex-shrink:0;
}
.status-chip-dot::after{
  content:'';
  position:absolute;inset:-4px;
  border-radius:50%;
  background:#3FB785;
  opacity:.4;
  animation:chipPulse 2s ease-out infinite;
}
@keyframes chipPulse{
  0%{transform:scale(1);opacity:.5}
  100%{transform:scale(2.2);opacity:0}
}

/* Big headline */
.cs-h{
  font-family:'Syne',sans-serif;
  font-weight:800;
  font-size:clamp(3rem,9vw,7.5rem);
  line-height:.95;
  letter-spacing:-0.04em;
  margin:0 0 32px;
  color:#fff;
}
.cs-h .accent{
  display:block;
  background:linear-gradient(135deg,#3FB785 0%,#1F8B5C 60%,#16734C 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.cs-h .period{
  display:inline-block;
  width:.18em;height:.18em;
  background:#3FB785;
  border-radius:50%;
  vertical-align:.08em;
  margin-left:.05em;
  box-shadow:0 0 32px rgba(63,183,133,0.7);
}

.cs-sub{
  max-width:580px;
  margin:0 auto 56px;
  font-size:1.0625rem;
  line-height:1.7;
  color:#FFFFFF;
}

/* CTA row */
.cs-cta-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-bottom:80px;
}
.cs-primary{
  display:inline-flex;align-items:center;gap:10px;
  padding:16px 28px;
  background:linear-gradient(135deg,#1F8B5C,#16734C);
  color:#fff;
  font-family:'Syne',sans-serif;
  font-weight:700;font-size:.95rem;
  border-radius:10px;
  text-decoration:none;
  transition:.25s;
  box-shadow:0 8px 32px rgba(31,139,92,0.3);
}
.cs-primary:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(31,139,92,0.45)}
.cs-secondary{
  display:inline-flex;align-items:center;gap:8px;
  padding:16px 24px;
  background:transparent;
  color:#C8CCE8;
  font-family:'Instrument Sans',sans-serif;
  font-weight:600;font-size:.95rem;
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;
  text-decoration:none;
  transition:.25s;
}
.cs-secondary:hover{
  border-color:rgba(255,255,255,0.35);
  background:rgba(255,255,255,0.04);
}

/* Spec strip */
.spec-strip{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0;
  max-width:760px;
  margin:0 auto;
  padding-top:48px;
  border-top:1px solid rgba(255,255,255,0.08);
}
.spec{
  text-align:center;
  padding:0 24px;
  border-right:1px solid rgba(255,255,255,0.06);
}
.spec:last-child{border-right:none}
.spec-num{
  font-family:'Syne',sans-serif;
  font-weight:800;font-size:1.75rem;
  color:#fff;
  line-height:1;
  margin-bottom:8px;
  letter-spacing:-.02em;
}
.spec-num .unit{
  font-size:.95rem;
  color:#3FB785;
  margin-left:2px;
}
.spec-label{
  font-family:'Instrument Sans',sans-serif;
  font-size:.74rem;font-weight:500;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:#8A93BD;
}

/* ── FOOTER ── */
footer{
  position:relative;z-index:2;
  background:rgba(8,13,30,0.6);
  padding:32px 60px;
  display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid rgba(255,255,255,0.06);
  font-size:.78rem;
}
.f-copy{color:#404870}
.f-links{display:flex;gap:24px}
.f-links a{color:#3A4068;text-decoration:none;transition:.2s}
.f-links a:hover{color:#3FB785}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  nav{padding:0 20px;gap:0;height:60px}
  nav a:not(.nav-cta):not(.logo){display:none}
  .nav-cta{font-size:.78rem;padding:7px 14px}
  .cs-page{padding:120px 20px 60px}
  .cs-h{font-size:clamp(2.6rem,12vw,4.5rem)}
  .spec-strip{grid-template-columns:1fr;gap:24px;padding-top:32px}
  .spec{border-right:none;border-bottom:1px solid rgba(255,255,255,0.06);padding-bottom:24px}
  .spec:last-child{border-bottom:none;padding-bottom:0}
  footer{flex-direction:column;gap:16px;padding:28px 20px;text-align:center}
  .f-links{flex-wrap:wrap;justify-content:center;gap:14px 20px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;transition-duration:0.01ms !important}
}
</style>
</head>

</html>
