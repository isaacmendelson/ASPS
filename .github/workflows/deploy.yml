name: Build and Deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - "ASPSBackend14_J/**"
      - "Analyzers/**"
      - "apps/admin/angular/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Deploy Backend (sidecar)"
        type: boolean
        default: true
      deploy_webapi:
        description: "Deploy WebApi"
        type: boolean
        default: true
      deploy_angular:
        description: "Deploy Angular Admin"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acraspsisaacdev
  RESOURCE_GROUP: rg-asps-dev
  WEBAPI_APP: ca-webapi-dev
  ANGULAR_APP: ca-angular-admin-dev

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      webapi: ${{ steps.changes.outputs.webapi }}
      angular: ${{ steps.changes.outputs.angular }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'ASPSBackend14_J/ASPSBackend/**'
              - 'ASPSBackend14_J/Business/**'
              - 'ASPSBackend14_J/Common/**'
              - 'ASPSBackend14_J/Interface/**'
              - 'Analyzers/**'
            webapi:
              - 'ASPSBackend14_J/WebApi/**'
              - 'ASPSBackend14_J/Business/**'
              - 'ASPSBackend14_J/Common/**'
              - 'ASPSBackend14_J/Interface/**'
            angular:
              - 'apps/admin/angular/**'

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build solution
        run: dotnet build ASPSBackend14_J/ASPSBackend.sln -c Release --nologo
      - name: Run tests
        run: dotnet test ASPSBackend14_J/ASPS.Tests/ASPS.Tests.csproj --nologo -c Release --no-build

  # ── Build and push images to ACR ──────────────────────────

  build-push-backend:
    needs: [detect-changes, build-test]
    if: needs.detect-changes.outputs.backend == 'true' || github.event.inputs.deploy_backend == 'true'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        id: meta
        run: echo "tag=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Backend image
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image asps-backend:${{ steps.meta.outputs.tag }} \
            --image asps-backend:latest \
            --file ASPSBackend14_J/ASPSBackend/Dockerfile \
            .

  build-push-webapi:
    needs: [detect-changes, build-test]
    if: needs.detect-changes.outputs.webapi == 'true' || github.event.inputs.deploy_webapi == 'true'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        id: meta
        run: echo "tag=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push WebApi image
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image asps-webapi:${{ steps.meta.outputs.tag }} \
            --image asps-webapi:latest \
            --file ASPSBackend14_J/WebApi/Dockerfile \
            ASPSBackend14_J

  build-push-angular:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.angular == 'true' || github.event.inputs.deploy_angular == 'true'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        id: meta
        run: echo "tag=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Angular Admin image
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image asps-angular-admin:${{ steps.meta.outputs.tag }} \
            --image asps-angular-admin:latest \
            --file apps/admin/angular/Dockerfile \
            apps/admin/angular

  # ── Deploy to Azure Container Apps ────────────────────────
  # Backend runs as a sidecar inside ca-webapi-dev (not a standalone app).
  # Updating the sidecar requires exporting the current YAML, patching the
  # image tag, and re-applying — `az containerapp update --image` only
  # touches the main container.

  deploy:
    needs: [build-push-backend, build-push-webapi]
    if: always() && (needs.build-push-backend.result == 'success' || needs.build-push-webapi.result == 'success')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Export current Container App config
        run: |
          az containerapp show \
            --name ${{ env.WEBAPI_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --output yaml > app.yaml

      - name: Patch WebApi image
        if: needs.build-push-webapi.result == 'success'
        run: |
          TAG="${{ needs.build-push-webapi.outputs.image-tag }}"
          sed -i "s|${{ env.ACR_NAME }}.azurecr.io/asps-webapi:[^ ]*|${{ env.ACR_NAME }}.azurecr.io/asps-webapi:${TAG}|g" app.yaml
          echo "WebApi image → asps-webapi:${TAG}"

      - name: Patch Backend sidecar image
        if: needs.build-push-backend.result == 'success'
        run: |
          TAG="${{ needs.build-push-backend.outputs.image-tag }}"
          sed -i "s|${{ env.ACR_NAME }}.azurecr.io/asps-backend:[^ ]*|${{ env.ACR_NAME }}.azurecr.io/asps-backend:${TAG}|g" app.yaml
          echo "Backend sidecar image → asps-backend:${TAG}"

      - name: Deploy sidecar Container App
        run: |
          az containerapp update \
            --name ${{ env.WEBAPI_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --yaml app.yaml

      - name: Verify deployment
        run: |
          sleep 15
          az containerapp show \
            --name ${{ env.WEBAPI_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.latestRevisionName" \
            --output tsv

  # ── Deploy Angular Admin ───────────────────────────────────
  # Standalone Container App, single container — simple image update
  # (no sidecar, no YAML export/patch needed).

  deploy-angular:
    needs: [build-push-angular]
    if: needs.build-push-angular.result == 'success'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Angular Admin image
        run: |
          TAG="${{ needs.build-push-angular.outputs.image-tag }}"
          az containerapp update \
            --name ${{ env.ANGULAR_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/asps-angular-admin:${TAG}
          echo "Angular Admin image → asps-angular-admin:${TAG}"

      - name: Verify deployment
        run: |
          sleep 15
          az containerapp show \
            --name ${{ env.ANGULAR_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.latestRevisionName" \
            --output tsv
