name: Reproducible build and test baseline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.308
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/extension/chrome/tests/package-lock.json
      - name: Verify locked build and exact test baseline
        shell: pwsh
        run: ./scripts/verify.ps1 -Bootstrap
