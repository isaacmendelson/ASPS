services:
  mysql:
    image: mysql:8.0
    container_name: asps-mysql
    restart: unless-stopped
    command: --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: zappa22
      MYSQL_DATABASE: ASPSBackend2DB
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./aspsbackend2db_20260728.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pzappa22"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - asps-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: asps-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      analyzer:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;database=aspsbackend2db;user=root;password=zappa22;AllowPublicKeyRetrieval=True;SslMode=None;"
      Security__KeysFilePath: /app/keys/curve-server-keys.json
      Security__ServerPublicKeyFilePath: /app/public-keys/curve-server-public-key.txt
      CQRS__BindEndpoint: "tcp://*:5556"
      CQRS__SharedSecret: "${CQRS_SHARED_SECRET:?CQRS_SHARED_SECRET must be set}"
      Messaging__AcceptLegacyV0: "true"
    ports:
      - "5555:5555"
      - "50001:50001"
      - "50002:50002"
    volumes:
      - curve_keys:/app/keys
      - curve_public_keys:/app/public-keys
      - analyzer_socket:/run/asps-analyzer
    networks:
      - asps-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: asps-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --hostname=http://localhost:8081
      - --hostname-backchannel-dynamic=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q 'HTTP/1.1 200' <&3"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - asps-network

  webapi:
    build:
      context: .
      dockerfile: Dockerfile.webapi
    container_name: asps-webapi
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      keycloak:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Security__CurveClientOnly: "true"
      Security__ServerPublicKeyFilePath: /app/public-keys/curve-server-public-key.txt
      CQRS__SharedSecret: "${CQRS_SHARED_SECRET:?CQRS_SHARED_SECRET must be set}"
      Cors__AllowedOrigins__0: "http://localhost:4200"
      Cors__AllowedOrigins__1: "http://localhost:4201"
    ports:
      - "8080:8080"
    networks:
      - asps-network
    volumes:
      - curve_public_keys:/app/public-keys:ro

  angular-admin:
    build:
      context: ./apps/admin/angular
      dockerfile: Dockerfile
    container_name: asps-angular-admin
    restart: unless-stopped
    depends_on:
      - webapi
    environment:
      API_URL: http://localhost:8080
      KEYCLOAK_URL: http://localhost:8081
      KEYCLOAK_REALM: asps
      KEYCLOAK_CLIENT_ID: asps-angular-admin
    ports:
      - "4201:80"
    networks:
      - asps-network

  analyzer:
    build:
      context: .
      dockerfile: Dockerfile.analyzer
    container_name: asps-analyzer
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETUID
      - SETGID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
      - /home/analyzer/.cache:rw,noexec,nosuid,nodev,size=64m
      - /run:rw,noexec,nosuid,nodev,size=1m
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - analyzer_socket:/run/asps-analyzer
    networks:
      - analyzer-egress

volumes:
  mysql_data:
  curve_keys:
  curve_public_keys:
  keycloak_data:
  analyzer_socket:

networks:
  asps-network:
    driver: bridge
  analyzer-egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
