version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# Secrets come from a .env file (gitignored).
# Copy .env.example → .env and fill in values before deploying.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─────────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: asps-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ASPSBackend2DB}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Initialize DB with dump on first run
      - ./aspsbackend2db_20260130.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # Shell form: $MYSQL_ROOT_PASSWORD is resolved inside the container at runtime
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - asps-network

  # ─────────────────────────────────────────────
  # ASPSBackend (Business layer + Python Analyzer)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: asps-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5555:5555"   # NetMQ CQRS processor
      - "5556:5556"   # CQRS Gateway (WebApi)
      - "50001:50001" # RealTime Alert Listener (Desktop ZMQ REQ)
      - "50002:50002" # Notification Publisher (Desktop ZMQ SUB)
    environment:
      # DB credentials — injected from .env, never hardcoded
      - ConnectionStrings__DefaultConnection=server=mysql;port=3306;database=${MYSQL_DATABASE:-ASPSBackend2DB};user=root;password=${MYSQL_ROOT_PASSWORD};AllowPublicKeyRetrieval=True;SslMode=None;
      # CURVE keypair stored in a persistent volume
      - Security__KeysFilePath=/app/keys/curve-server-keys.json
    volumes:
      # CURVE keys must persist across restarts — otherwise all clients lose their keys
      - curve_keys:/app/keys
    networks:
      - asps-network

  # ─────────────────────────────────────────────
  # WebApi (Admin Dashboard + REST API)
  # ─────────────────────────────────────────────
  webapi:
    build:
      context: .
      dockerfile: Dockerfile.webapi
    container_name: asps-webapi
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:5001"   # Admin Dashboard + Swagger + SignalR
    networks:
      - asps-network

volumes:
  mysql_data:
  curve_keys:   # Persistent CURVE keypair — survives container restarts

networks:
  asps-network:
    driver: bridge
